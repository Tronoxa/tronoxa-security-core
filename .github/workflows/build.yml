name: Reproducible Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions: read-all

concurrency:
  group: security-core-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build and test
        run: |
          npm run build
          npm test

      - name: Create deterministic release artifacts
        env:
          SOURCE_DATE_EPOCH: '0'
        run: |
          install -d artifacts
          npm pack --pack-destination artifacts
          git archive --format=tar --prefix=tronoxa-security-core/ HEAD \
            | gzip -n > artifacts/tronoxa-security-core-source.tar.gz
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner \
            -cf - packages/bsc-core \
            | gzip -n > artifacts/tronoxa-bsc-core-0.1.0-public-snapshot.tar.gz
          (
            cd artifacts
            sha256sum *.tgz *.tar.gz | LC_ALL=C sort > SHA256SUMS
          )

      - name: Verify checksums
        run: cd artifacts && sha256sum --check SHA256SUMS

      - name: Upload workflow evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-core-${{ github.sha }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 90

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: |
            artifacts/*.tgz
            artifacts/*.tar.gz
            artifacts/SHA256SUMS

      - name: Preserve the signed provenance bundle
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          test -s "$ATTESTATION_BUNDLE"
          cp "$ATTESTATION_BUNDLE" \
            "artifacts/tronoxa-security-core-${GITHUB_REF_NAME}.sigstore.json"

      - name: Attach artifacts to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --verify-tag --generate-notes
          gh release upload "$TAG" artifacts/* --clobber
